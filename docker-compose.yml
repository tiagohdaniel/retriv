services:
  chromadb:
    image: chromadb/chroma:1.0.0
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      # chromadb/chroma:1.0.0 has no curl/httpx/python — check TCP port directly
      test: ["CMD", "sh", "-c", "grep -q ':1F40 ' /proc/net/tcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - CHROMA_MODE=server
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    depends_on:
      chromadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
